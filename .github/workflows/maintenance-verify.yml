name: Maintenance Verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Reset settings regression
        run: node --test maintenance-checks/reset-settings.check.mjs
      - name: Modal focus regression
        run: node --test maintenance-checks/modal-focus.check.mjs
      - name: Existing tests
        run: npm test
      - name: Production build
        run: npm run build
