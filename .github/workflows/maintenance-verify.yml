name: Maintenance Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Reset settings regression
        run: node --test maintenance-checks/reset-settings.check.mjs
      - name: Modal focus regression
        run: node --test maintenance-checks/modal-focus.check.mjs
      - name: Clock state regression
        run: node --test maintenance-checks/clock-state.check.mjs
      - name: Targeted clock lint
        run: npx eslint src/hooks/useFiveDGomoku.ts
      - name: Existing tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chrome test driver
        run: |
          npm install --no-save --no-package-lock puppeteer-core@24
          command -v google-chrome
      - name: M4 React model integration in real Chrome
        run: node maintenance-checks/visual-editor-react-browser.check.mjs
