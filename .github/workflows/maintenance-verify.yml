name: Maintenance Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Reset settings regression
        run: node --test maintenance-checks/reset-settings.check.mjs
      - name: Modal focus regression
        run: node --test maintenance-checks/modal-focus.check.mjs
      - name: Clock state regression
        run: node --test maintenance-checks/clock-state.check.mjs
      - name: Targeted clock lint
        run: npx eslint src/hooks/useFiveDGomoku.ts
      - name: Existing tests
        run: npm test
      - name: Pinned shared editor M5 and model/source safety
        run: |
          node src/visual-editor-platform/verify-vendor.mjs
          node --test maintenance-checks/visual-editor-m5.check.mjs
      - name: Production build
        run: npm run build
      - name: Install Playwright Chrome driver outside npm dependency graph
        run: |
          python3 -m pip install --quiet playwright
          command -v google-chrome
      - name: M4 React model integration in real Chrome
        run: python3 maintenance-checks/visual-editor-react-browser.py
      - name: Project-subpath production build check
        env:
          GOMOKU_PAGES_BASE: '1'
        run: |
          npm run build
          grep -q '/Gomoku-5D/assets/' dist/index.html

