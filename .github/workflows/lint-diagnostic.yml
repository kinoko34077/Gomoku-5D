name: Lint Diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Capture targeted lint output
        shell: bash
        run: |
          set +e
          npx eslint src/hooks/useFiveDGomoku.ts > lint-output.txt 2>&1
          status=$?
          cat lint-output.txt
          echo "$status" > lint-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: gomoku-hook-lint-diagnostic
          path: |
            lint-output.txt
            lint-status.txt
